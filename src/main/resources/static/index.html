<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Basic HTML template for an online shop project" />
    <title>Online Shop</title>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Styles: create src/main/resources/static/css/styles.css or adjust path -->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- Basic theme color for mobile browsers -->
    <meta name="theme-color" content="#0d6efd" />
</head>
<body>
    <header>
        <nav aria-label="Main navigation">
            <a href="/" class="brand">Online Shop</a>
            <ul class="nav">
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Welcome</h1>
            <p>This is a starter template. Replace this content with your application markup.</p>
        </section>
    </main>

    <footer>
        <small>&copy; <span id="year"></span> Online Shop</small>
    </footer>

    <!-- Scripts -->
    <script>
        // Set current year in footer
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
