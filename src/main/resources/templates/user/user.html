<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Aura Games | Profile</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@400..800&family=DM+Sans:opsz,wght@9..40,100..1000&family=Inter:opsz,wght@14..32,100..900&family=Orbitron:wght@400..900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
    <link rel="stylesheet" th:href="@{/css/user.css}">
    <link rel="stylesheet" th:href="@{/css/overview.css}">
    <link rel="stylesheet" th:href="@{/css/settings.css}">

    <script th:src="@{/js/jquery-4.0.0.js}"></script>
    <script th:src="@{/js/jquery.easing.js}"></script>
    <script th:src="@{/js/linechart.js}"></script>
  </head>

  <body>

    <div class="sidebar-container">
      <div style="display: flex; align-items: center; margin: 15px 0 60px 0;">
        <img th:src="@{/images/logo.png}" alt="aura-games-logo" style="width: 75px; height:75px; margin: 0 5px" id="aura-games-logo">
        <div style="color: white; padding: 0; margin: 0;">
          <p style="font-family: 'Orbitron'; font-size: 25px; font-weight: 650; padding: 0; margin: 0;">
            <span style="color: rgba(212, 0, 255, 0.555)">AURA</span> GAMES
          </p>
          <a href="/" class="nav-link" onmouseout="this.style.color=''">
            ← GO HOME
          </a>  
        </div>
      </div>

      <button type="button" class="sidebar-button" th:classappend="${pageFragment == 'user/overview'} ? ' active' : ''" data-href="/user/overview" data-page="overview">
        <div class="sidebar-icon icon-overview"></div>
        <p>Overview</p>
      </button>

      <button type="button" class="sidebar-button" th:classappend="${pageFragment == 'user/settings'} ? ' active' : ''" data-href="/user/settings" data-page="settings">
        <div class="sidebar-icon icon-settings"></div>
        <p>Settings</p>
      </button>

      <button type="button" class="sidebar-button" id="logout-button">
        <div class="sidebar-icon icon-logout"></div>
        <p>Logout</p>
      </button>
    </div>

    <div class="page-container">
      <div class="page-header" th:text="${pageTitle}">DASHBOARD</div>

      <div th:replace="~{${pageFragment} :: content}"></div>
    </div>
    
    <script th:src="@{/js/user.js}"></script>
  </body>
</html>
