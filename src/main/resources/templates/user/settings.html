<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="content">

  <div class="settings-wrapper">
    <br>
    <!-- ACCOUNT INFO -->
    <p class="settings-card-title">Account Information</p>
    <div class="fade-line"></div>
    <div class="settings-card">
      <div class="input-wrapper">
        <label class="input-label">USERNAME</label>
        <input class="settings-input" type="text" id="settings-username" placeholder="username">
      </div>

      <button class="settings-save-button" id="save-account-button" disabled>SAVE CHANGES</button>
      <p class="settings-feedback" id="account-feedback"></p>
    </div>
    <div></div>

    <br><br>
    <!-- PASSWORD -->
    <p class="settings-card-title">Change Password</p>
    <div class="fade-line"></div>
    <div class="settings-card">
      <div class="input-wrapper">
        <label class="input-label">CURRENT PASSWORD</label>
        <input class="settings-input" type="password" id="current-password" placeholder="••••••••••••">
      </div>

      <div class="input-wrapper">
        <label class="input-label">NEW PASSWORD</label>
        <input class="settings-input" type="password" id="new-password" placeholder="••••••••••••">
      </div>

      <div class="strength-bar-container">
        <div class="strength-bar" id="settings-strength-bar"></div>
      </div>

      <div class="requirement-row">
        <p class="requirement-strength" id="settings-strength-label">Requirements</p>
        <div class="requirement-box" id="req-length">8+ CHR</div>
        <div class="requirement-box" id="req-case">a-Z</div>
        <div class="requirement-box" id="req-number">0-9</div>
        <div class="requirement-box" id="req-special">!@#</div>
      </div>

      <div class="input-wrapper">
        <label class="input-label">CONFIRM NEW PASSWORD</label>
        <input class="settings-input" type="password" id="confirm-new-password" placeholder="••••••••••••">
      </div>

      <button class="settings-save-button" id="save-password-button" disabled>
        <span id="save-password-text">UPDATE PASSWORD</span>
        <span id="save-password-spinner" style="display:none;">⟳</span>
      </button>
      <p class="settings-feedback" id="password-feedback"></p>
    </div>

  </div>

  <script th:src="@{/js/settings.js}"></script>

</th:block>

</body>
</html>
