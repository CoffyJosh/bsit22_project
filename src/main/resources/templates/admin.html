<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Aura Games | Admin</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@400..800&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@400..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@400..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
  </head>

  <body>

    <div class="sidebar-container">
      <div style="display: flex; align-items: center; margin: 15px 0 60px 0;">
        <img th:src="@{/images/logo.png}" alt="aura-games-logo" style="width: 75px; height:75px; margin: 0 5px" id="aura-games-logo">
        <div style="color: white; padding: 0; margin: 0;"> 
          <p style="font-family: 'Orbitron'; font-size: 25px; font-weight: 650; padding: 0; margin: 0;">
            <span style="color: rgba(212, 0, 255, 0.555)">AURA</span> GAMES
          </p>
          <p style="font-family: 'DM Sans'; font-size: 17px; font-weight: 400; padding: 0; margin: 0;">
            ADMIN
          </p>
        </div>
      </div>

      <button type="button" class="sidebar-button active" id="dashboard-button" data-page="dashboard">
        <div class="sidebar-icon icon-dashboard"></div>
        <p>Dashboard</p>
      </button>

      <button type="button" class="sidebar-button" id="products-button" data-page="products">
        <div class="sidebar-icon icon-products"></div>
        <p>Products</p>
      </button>

      <button type="button" class="sidebar-button" id="orders-button" data-page="orders">
        <div class="sidebar-icon icon-orders"></div>
        <p>Orders</p>
      </button>
    </div>

    <div class="page-container">
      <div class="page-header">
        DASHBOARD
      </div>
      
      <div class="stat-grid">
        <div class="stat-box" style="grid-area: box-1">
          <p class="stat-name">TRANSACTIONS</p>
          <p class="stat-value">-------</p>
        </div>

        <div class="stat-box" style="grid-area: box-2">
          <p class="stat-name">EARNINGS</p>
          <p class="stat-value">-------</p>
        </div>

        <div class="stat-box" style="grid-area: box-3">
          <p class="stat-name">TOTAL REVENUE</p>
          <p class="stat-value">-------</p>
        </div>

        <div class="line-chart" style="grid-area: box-4">
          
          <div class="dashboard-controls" style="display: flex; gap: 15px; align-items: center; margin-bottom: 25px;">
            <div class="control-group">
              <label style="color: #9FA2B4; margin-right: 8px; font-size: 14px;">From:</label>
              <input type="date" id="dash-start-date" style="background: #181926; color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 6px;">
            </div>
            
            <div class="control-group">
              <label style="color: #9FA2B4; margin-right: 8px; font-size: 14px;">To:</label>
              <input type="date" id="dash-end-date" style="background: #181926; color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 6px;">
            </div>

            <button id="btn-update-dashboard" style="background: #8C00FF; color: #fff; border: none; padding: 7px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s;">
              Filter Analytics
            </button>
          </div> <div style="width: 100%;">
            <div id="line-chart-render"></div>
          </div>
          
        </div>

        <div class="stat-box" style="grid-area: box-5">
          </div>

      </div>
    </div>
    
    <html xmlns:sec="http://www.thymeleaf.org/extras/spring-security"></html>  
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script th:src="@{/js/linechart.js}"></script>
    <script th:src="@{/js/jquery-4.0.0.js}"></script>
    <script th:src="@{/js/jquery.easing.js}"></script>
    <script th:src="@{/js/admin.js}"></script>
  </body>
</html>
