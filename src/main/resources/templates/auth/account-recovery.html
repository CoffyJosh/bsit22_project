<div th:fragment="content" data-page-title="AURA GAMES | Account Recovery">

    <!-- STATE 1: EMAIL FORM -->
    <div th:if="${emailSent == null}">

        <h1 class="title">
            <span style="color:#9090A8;">ACCOUNT RECOVERY</span>
        </h1>

        <br><br>

        <form id="recovery-form">

            <div class="input-wrapper">
                <label class="input-label">EMAIL ADDRESS</label>
                <img class="input-icon" src="/images/email_icon.png">

                <input class="text-input"
                       type="email"
                       id="email"
                       name="email"
                       placeholder="username@domain.com"
                       required>
            </div>

            <p class="warning-text" id="emailWarningText"></p>

            <div style="display:flex; flex-direction:column;">

                <button class="confirm-button"
                        id="send-link-btn"
                        type="button">
                    SEND LINK
                </button>

                <br>

                <button class="back-button"
                        type="button"
                        onclick="window.history.back()"
                        style="color: rgba(255, 255, 255, 0.5); font-size: 8px;">
                    RETURN
                </button>

            </div>

        </form>

    </div>


    <!-- STATE 2: EMAIL SENT -->
    <div th:if="${emailSent != null}"
         style="width: 250px; height: 250px;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
                text-align:center;">

        <h1 class="title">
            <span style="color:#8A3FFC;">E</span><span style="color:#E0218A;">MAIL SENT</span>
        </h1>

        <br>

        <p style="font-family: Orbitron;
                  font-size: 12px;
                  font-weight: 400;
                  color: white;">
            We've sent a secure recovery link to your email inbox.
        </p>

        <br>

        <button class="back-button"
                type="button"
                hx-get="/login"
                hx-target="#auth-form-content"
                style="color: rgba(255, 255, 255, 0.5); font-size: 8px;">
            ← BACK TO LOGIN
        </button>

    </div>

</div>
