<!-- UPDATE FRAGMENT -->
<div th:fragment="content">
    <div id="update-password-page" data-page-title="AURA GAMES | Update Password">

        <!-- FORM STATE -->
        <div id="reset-form-state">
            <h1 class="title"><span style="color:#9090A8; margin: 10px 0;">CHANGE PASSWORD</span></h1>
            <form id="reset-form">

                <input type="hidden" id="token" th:value="${token}">
                <br>
                <p class="warning-text" id="resetWarning" style="max-width:250px; word-wrap:break-word; white-space:normal; text-align:center; margin: 0 auto;"></p>

                <div class="input-wrapper">
                    <label class="input-label">NEW PASSWORD</label>
                    <img class="input-icon" th:src="@{/images/password_icon.png}">
                    <input class="password-input"
                            type="password"
                            name="password"
                            placeholder="••••••••••••"
                            required
                            id="password-field">
                </div>

                <div class="strength-bar-container">
                    <div class="strength-bar"></div>
                </div>

                <div class="requirement-row">
                    <div class="requirement-strength"><p class="requirement-strength">Requirements</p></div>
                    <div class="requirement-box"><p>8+ CHR</p></div>
                    <div class="requirement-box"><p>a-Z</p></div>
                    <div class="requirement-box"><p>0-9</p></div>
                    <div class="requirement-box"><p>!@#</p></div>
                </div>

                <div class="input-wrapper">
                    <label class="input-label">CONFIRM PASSWORD</label>
                    <img class="input-icon" src="/images/password_icon.png">
                    <input class="password-input" type="password"
                        placeholder="••••••••••••" required
                        id="confirm-password-field">
                </div>

                <br>

                <button class="confirm-button" id="update-btn" type="button">
                    UPDATE
                </button>

            </form>
        </div>

        <!-- SUCCESS STATE (hidden by default) -->
        <div id="reset-success-state" style="display:none; width:250px; text-align:center;">
            <h1 class="title">
                <span style="color:#8A3FFC;">P</span><span style="color:#E0218A;">ASSWORD UPDATED</span>
            </h1>
            <br>
            <p style="font-family:Orbitron; font-size:12px; color:white;">
                Your password has been successfully changed.
            </p>
            <br>
            <button class="back-button" type="button"
                    hx-get="/login" hx-target="#auth-form-content"
                    style="color: rgba(255, 255, 255, 0.5); font-size: 8px;">
                ← BACK TO LOGIN
            </button>
        </div>

    </div>
</div>
