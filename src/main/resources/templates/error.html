<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Not Found</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background-color: #0a0010;
      background-image: radial-gradient(circle at 50% 30%, rgba(153, 0, 255, 0.12), transparent 60%);

      font-family: 'DM Sans', sans-serif;
      color: white;
    }

    .error-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;

      text-align: center;
      padding: 40px 60px;

      border: 1px solid rgba(255, 255, 255, 0.158);
      border-radius: 10px;
      background-color: rgba(153, 0, 255, 0.082);
    }

    .error-code {
      font-family: 'Orbitron', sans-serif;
      font-size: 72px;
      font-weight: 600;
      color: rgba(182, 92, 255, 0.9);
      text-shadow: 0 0 20px rgba(153, 0, 255, 0.5);
      margin: 0;
    }

    .error-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 400;
      color: white;
      margin: 0;
    }

    .error-message {
      font-size: 14px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.6);
      max-width: 360px;
      margin: 0;
    }

    .home-button {
      margin-top: 10px;
      padding: 12px 30px;

      border: 1px solid rgba(182, 92, 255, 0.5);
      border-radius: 50px;
      background-color: rgba(183, 0, 255, 0.15);

      font-family: 'Rajdhani', sans-serif;
      font-weight: 500;
      font-size: 15px;
      color: white;
      text-decoration: none;

      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .home-button:hover {
      background-color: rgba(183, 0, 255, 0.3);
      box-shadow: 0 0 15px rgba(162, 0, 255, 0.5);
    }
  </style>
</head>
<body>

  <div class="error-box">
    <p class="error-code">404</p>
    <p class="error-title">Page Not Found</p>
    <p class="error-message" th:text="${message != null ? message : 'This page doesn\'t exist or is currently unavailable.'}">
      This page doesn't exist or is currently unavailable.
    </p>
    <a href="/" class="home-button">BACK TO HOME</a>
  </div>

</body>
</html>
