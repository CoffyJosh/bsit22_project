<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Aura Games | Admin</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@400..800&family=DM+Sans:opsz,wght@9..40,100..1000&family=Inter:opsz,wght@14..32,100..900&family=Orbitron:wght@400..900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/transactions.css}">
    <link rel="stylesheet" th:href="@{/css/products.css}">

    <script th:src="@{/js/jquery-4.0.0.js}"></script>
    <script th:src="@{/js/jquery.easing.js}"></script>
    <script th:src="@{/js/linechart.js}"></script>
  </head>

  <body>

    <div class="sidebar-container">
      <div style="display: flex; align-items: center; margin: 15px 0 60px 0;">
        <img th:src="@{/images/logo.png}" alt="aura-games-logo" style="width: 75px; height:75px; margin: 0 5px" id="aura-games-logo">
        <div style="color: white; padding: 0; margin: 0;">
          <p style="font-family: 'Orbitron'; font-size: 25px; font-weight: 650; padding: 0; margin: 0;">
            <span style="color: rgba(212, 0, 255, 0.555)">AURA</span> GAMES
          </p>
          <p style="font-family: 'DM Sans'; font-size: 17px; font-weight: 400; padding: 0; margin: 0;">
            ADMIN
          </p>
        </div>
      </div>

      <button type="button" class="sidebar-button" th:classappend="${pageFragment == 'admin/dashboard'} ? ' active' : ''" data-href="/admin/dashboard" data-page="dashboard">
        <div class="sidebar-icon icon-dashboard"></div>
        <p>Dashboard</p>
      </button>

      <button type="button" class="sidebar-button" th:classappend="${pageFragment == 'admin/products'} ? ' active' : ''" data-href="/admin/products" data-page="products">
        <div class="sidebar-icon icon-products"></div>
        <p>Products</p>
      </button>

      <button type="button" class="sidebar-button" th:classappend="${pageFragment == 'admin/transactions'} ? ' active' : ''" data-href="/admin/transactions" data-page="transactions">
        <div class="sidebar-icon icon-orders"></div>
        <p>Transactions</p>
      </button>

      <button type="button" class="sidebar-button" id="logout-btn">
        <div class="sidebar-icon icon-logout"></div>
        <p>Logout</p>
      </button>
      
    </div>

    <div class="page-container">
      <div class="page-header" th:text="${pageTitle}">DASHBOARD</div>

      <div th:replace="~{${pageFragment} :: content}"></div>
    </div>
    
    <script th:src="@{/js/admin.js}"></script>
  </body>
</html>
